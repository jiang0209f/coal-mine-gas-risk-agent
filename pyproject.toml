[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-mine-gas-risk-agent"
version = "0.1.0"
description = "采煤工作面瓦斯预测预警与管控辅助智能体"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
models = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<1.11",
    "lightgbm>=4.5,<5",
    "torch>=2.6,<3",
    "einops>=0.8,<1",
    "sympy>=1.13,<2",
    "PyWavelets>=1.6,<2",
    "matplotlib>=3.8,<4",
    "skops>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
